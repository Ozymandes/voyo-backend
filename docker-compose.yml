# VOYO Routing Stack — Valhalla + OSRM + VROOM
#
# NOTE: the obsolete top-level `version:` field is intentionally removed —
# modern Docker Compose (v2+) ignores it and prints a warning every run.
# Use `docker compose` (space, not hyphen) for v2+ invocation.
#
# Services:
#   valhalla  :8002  — routing + isochrones (used by CLEO and the app directly)
#   osrm      :5000  — OSRM-protocol routing backend (used by VROOM only)
#   vroom     :8081  — vehicle route optimization (POST /api/v1/itinerary/optimize)
#
# Usage:
#   docker-compose up -d          # start all services
#   docker-compose logs -f osrm   # watch OSRM first-run progress (~5-10 min)
#   docker-compose down           # stop
#
# First run:
#   Valhalla downloads Egypt OSM (~50 MB) and builds tiles → config/valhalla/custom_files/
#   OSRM    downloads Egypt OSM (~400 MB), extracts + partitions routes → osrm_data volume
#   Both cache their processed data; subsequent starts are fast (seconds).

services:

  # ── Valhalla ────────────────────────────────────────────────────────────────
  # Used for: turn-by-turn routing, isochrones, CLEO trip optimization.
  # Protocol: Valhalla HTTP API (POST /route, POST /isochrone, etc.)

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: voyo-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./config/valhalla/custom_files:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - build_tar=false
      - min_x=24.0
      - min_y=21.0
      - max_x=37.0
      - max_y=32.5
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # ── OSRM ────────────────────────────────────────────────────────────────────
  # Used for: VROOM distance-matrix queries (OSRM HTTP protocol).
  # NOT used directly by the app — only by VROOM.
  #
  # First run: downloads Egypt PBF (~400 MB) and runs extract + partition +
  # customize (MLD algorithm). Takes ~5-10 min. Data is cached in osrm_data
  # volume and reused on every subsequent start.

  osrm:
    image: osrm/osrm-backend
    container_name: voyo-osrm
    volumes:
      - ./osrm-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /data/egypt-latest.osrm ]; then
          echo '=== OSRM: data downloaded on host; extracting routes (car profile)... ==='
          osrm-extract -p /opt/car.lua /data/egypt-latest.osm.pbf
          echo '=== Partitioning (MLD algorithm)... ==='
          osrm-partition /data/egypt-latest.osrm
          echo '=== Customising... ==='
          osrm-customize /data/egypt-latest.osrm
          echo '=== OSRM data ready. ==='
        fi
        exec osrm-routed \
          --algorithm mld \
          --max-table-size 2000 \
          --port 5000 \
          --ip 0.0.0.0 \
          /data/egypt-latest.osrm
    ports:
      - "5000:5000"
    healthcheck:
      # The image lacks wget/curl; bash + /dev/tcp gives a pure TCP liveness check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 900s
    restart: unless-stopped

  # ── VROOM ───────────────────────────────────────────────────────────────────
  # Vehicle Route Optimization — orders POIs into an optimal multi-stop itinerary.
  # Requires OSRM (not Valhalla) for its distance-matrix queries.
  # Config: config/vroom/conf/config.yml

  vroom:
    image: vroomvrp/vroom-docker:v1.13.0
    container_name: voyo-vroom
    ports:
      - "8081:8081"
    volumes:
      - ./config/vroom/conf:/conf
    environment:
      - VROOM_ROUTER=osrm
    depends_on:
      osrm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Image-agnostic TCP liveness check (same pattern OSRM uses). The
      # image lacks curl, so a curl-based check falsely marks this
      # "unhealthy" even though VROOM is serving /health correctly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  osrm_data:
    name: voyo_osrm_data
